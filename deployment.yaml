apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-dashboard
  template:
    metadata:
      labels:
        app: traffic-dashboard
    spec:
      containers:
      - name: traffic-dashboard
        image: your-dockerhub-username/traffic-dashboard:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-dashboard-service
spec:
  type: NodePort
  selector:
    app: traffic-dashboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080